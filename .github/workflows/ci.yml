name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop, dev]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      orders: ${{ steps.changes.outputs.orders }}
      kitchen: ${{ steps.changes.outputs.kitchen }}
      warehouse: ${{ steps.changes.outputs.warehouse }}
      market: ${{ steps.changes.outputs.market }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        uses: dorny/paths-filter@v2
        id: changes
        with:
          list-files: shell
          filters: |
            orders:
              - 'services/orders/**'
              - 'packages/**'
            kitchen:
              - 'services/kitchen/**'
              - 'packages/**'
            warehouse:
              - 'services/warehouse/**'
              - 'packages/**'
            market:
              - 'services/market/**'
              - 'packages/**'
            frontend:
              - 'frontend/**'
              - 'packages/**'

  lint-orders:
    name: Lint Orders Service
    needs: detect-changes
    if: needs.detect-changes.outputs.orders == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/orders/package-lock.json'

      - name: Install dependencies
        working-directory: ./services/orders
        run: npm ci

      - name: Run ESLint
        working-directory: ./services/orders
        run: npm run lint

      - name: Type Check
        working-directory: ./services/orders
        run: npm run build

  test-orders:
    name: Test Orders Service
    needs: detect-changes
    if: needs.detect-changes.outputs.orders == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/orders/package-lock.json'

      - name: Install dependencies
        working-directory: ./services/orders
        run: npm ci

      - name: Run tests
        working-directory: ./services/orders
        run: npm test -- --passWithNoTests

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orders-coverage
          path: services/orders/coverage

  # Kitchen Service
  lint-kitchen:
    name: Lint Kitchen Service
    needs: detect-changes
    if: needs.detect-changes.outputs.kitchen == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/kitchen/package-lock.json'

      - name: Install dependencies
        working-directory: ./services/kitchen
        run: npm ci

      - name: Run ESLint
        working-directory: ./services/kitchen
        run: npm run lint

      - name: Type Check
        working-directory: ./services/kitchen
        run: npm run build

  test-kitchen:
    name: Test Kitchen Service
    needs: detect-changes
    if: needs.detect-changes.outputs.kitchen == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/kitchen/package-lock.json'

      - name: Install dependencies
        working-directory: ./services/kitchen
        run: npm ci

      - name: Run tests
        working-directory: ./services/kitchen
        run: npm test -- --passWithNoTests

  # Summary job
  ci-success:
    name: CI Success
    if: always()
    needs: [lint-orders, test-orders, lint-kitchen, test-kitchen]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.lint-orders.result }}" == "failure" ]] || \
             [[ "${{ needs.test-orders.result }}" == "failure" ]] || \
             [[ "${{ needs.lint-kitchen.result }}" == "failure" ]] || \
             [[ "${{ needs.test-kitchen.result }}" == "failure" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed or were skipped"
