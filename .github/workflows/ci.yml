name: CI

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [dev, test, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      orders: ${{ steps.changes.outputs.orders }}
      kitchen: ${{ steps.changes.outputs.kitchen }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        uses: dorny/paths-filter@v2
        id: changes
        with:
          list-files: shell
          token: ${{ github.token }}
          base: ${{ github.event.before || github.event.pull_request.base.sha }}
          filters: |
            orders:
              - 'services/orders/**'
            kitchen:
              - 'services/kitchen/**'

  # Orders Service
  orders:
    name: Orders Service
    needs: detect-changes
    if: needs.detect-changes.outputs.orders == 'true'
    uses: ./.github/workflows/service-ci.yml
    with:
      service-name: orders
      service-path: ./services/orders
      should-deploy: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/test' || github.ref == 'refs/heads/main') }}
      environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      custom-domain: ${{ github.ref == 'refs/heads/main' && vars.ORDERS_DOMAIN_PROD || (github.ref == 'refs/heads/test' && vars.ORDERS_DOMAIN_STAGING || '') }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ORDERS }}

  # Kitchen Service
  kitchen:
    name: Kitchen Service
    needs: detect-changes
    if: needs.detect-changes.outputs.kitchen == 'true'
    uses: ./.github/workflows/service-ci.yml
    with:
      service-name: kitchen
      service-path: ./services/kitchen
      should-deploy: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/test' || github.ref == 'refs/heads/main') }}
      environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      custom-domain: ${{ github.ref == 'refs/heads/main' && vars.KITCHEN_DOMAIN_PROD || (github.ref == 'refs/heads/test' && vars.KITCHEN_DOMAIN_STAGING || '') }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_KITCHEN }}
