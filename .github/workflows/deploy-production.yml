name: Deploy Production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-changes:
    name: Load Changed Services
    runs-on: ubuntu-latest
    outputs:
      orders: ${{ steps.load.outputs.orders }}
      kitchen: ${{ steps.load.outputs.kitchen }}
    steps:
      - name: Download changed services artifact
        uses: actions/download-artifact@v4
        with:
          name: changed-services-${{ github.sha }}
        continue-on-error: true

      - name: Load changes or deploy all
        id: load
        run: |
          if [ -f changed-services.txt ]; then
            echo "Loading changes from artifact..."
            cat changed-services.txt
            source changed-services.txt
            echo "orders=$orders" >> $GITHUB_OUTPUT
            echo "kitchen=$kitchen" >> $GITHUB_OUTPUT
          else
            echo "No artifact found, deploying all services..."
            echo "orders=true" >> $GITHUB_OUTPUT
            echo "kitchen=true" >> $GITHUB_OUTPUT
          fi

  deploy-orders:
    name: Deploy Orders to Production
    needs: load-changes
    if: needs.load-changes.outputs.orders == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        working-directory: ./services/orders
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        working-directory: ./services/orders
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Production
        id: deploy
        working-directory: ./services/orders
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Wait for deployment
        run: sleep 15

      - name: Health Check
        run: |
          echo "Running health check..."
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ steps.deploy.outputs.url }}/api)
          if [ $response -eq 200 ]; then
            echo "✅ Health check passed (HTTP $response)"
          else
            echo "❌ Health check failed (HTTP $response)"
            exit 1
          fi

      - name: Deployment Summary
        run: |
          echo "### Orders Service Deployed 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Production URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Health check:** ✅ Passed" >> $GITHUB_STEP_SUMMARY

  deploy-kitchen:
    name: Deploy Kitchen to Production
    needs: load-changes
    if: needs.load-changes.outputs.kitchen == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        working-directory: ./services/kitchen
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        working-directory: ./services/kitchen
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Production
        id: deploy
        working-directory: ./services/kitchen
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Wait for deployment
        run: sleep 15

      - name: Health Check
        run: |
          echo "Running health check..."
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ steps.deploy.outputs.url }}/api)
          if [ $response -eq 200 ]; then
            echo "✅ Health check passed (HTTP $response)"
          else
            echo "❌ Health check failed (HTTP $response)"
            exit 1
          fi

      - name: Deployment Summary
        run: |
          echo "### Kitchen Service Deployed 🍳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Production URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Health check:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
